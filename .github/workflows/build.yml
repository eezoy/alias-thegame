name: Сборка APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Собрать APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "Alias-1.0.${{ github.run_number }}.apk"

      - name: Сохранить APK в сборке
        uses: actions/upload-artifact@v4
        with:
          name: Alias-APK
          path: Alias-*.apk

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Alias 1.0.${{ github.run_number }}
          make_latest: true
          files: Alias-*.apk
          body: |
            Скачайте файл `Alias-1.0.${{ github.run_number }}.apk` ниже, откройте его на телефоне и установите.
            Новая версия ставится поверх старой, настройки и история слов сохраняются.
